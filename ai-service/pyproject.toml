[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sophikon-ai-service"
version = "0.1.0"
description = "Sophikon standalone AI brain service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.2",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
